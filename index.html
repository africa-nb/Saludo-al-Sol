<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Aplicación interactiva para la práctica del Saludo al Sol (Surya Namaskar).">

    <meta name="theme-color"
          content="#D97706">

    <title>Saludo al Sol</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;900&display=swap"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS -->
     
    <link rel="stylesheet" href="css/design-system.css">  
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/toolbar.css">
    <link rel="stylesheet" href="./css/panels.css">
    <link rel="stylesheet" href="./css/clock.css">
    <link rel="stylesheet" href="./css/posture-card.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/dialogs.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/responsive.css">

</head>

<body>

    <!-- CABECERA -->

    <header id="header"></header>

    <!-- BARRA DE HERRAMIENTAS -->

    <nav id="toolbar"></nav>

    <!-- CONTENIDO PRINCIPAL -->

    <main id="app">

        <!-- PANEL SUPERIOR -->

        <section id="status-panel"></section>

        <!-- CRONÓMETRO -->

        <section id="timer-panel"></section>

        <!-- CONTADOR -->

        <section id="cycle-counter"></section>

        <!-- ESTADÍSTICAS -->

        <section id="statistics-panel"></section>

        <!-- RESPIRACIÓN -->

        <section id="breathing-panel"></section>

        <!-- VOZ -->

        <section id="speech-panel"></section>

        <!-- RELOJ -->

        <section id="clock-container">

            <!-- CENTRO -->

            <div id="sun-center">

                <div id="sun-icon">☀️</div>

                <h2>Saludo al Sol</h2>

                <p>Surya Namaskar</p>

                <span>11 posturas</span>

            </div>

            <!-- SVG -->

            <svg id="clock-svg"></svg>

            <!-- POSTURAS -->

            <div id="postures"></div>

        </section>

    </main>

    <!-- DIÁLOGOS -->

    <div id="dialogs"></div>

    <!-- PIE -->

    <footer id="footer"></footer>

    <!-- APP -->

    <script type="module" src="./js/app.js"></script>

</body>

</html>

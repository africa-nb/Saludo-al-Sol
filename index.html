<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Aplicación interactiva para la práctica del Saludo al Sol (Surya Namaskar).">

    <meta name="author" content="África Núñez Bazán">      

    <meta name="theme-color"
          content="#D97706">

    <link rel="manifest" href="./manifest.json">      

    <title>Saludo al Sol</title>

    
     
    <link rel="stylesheet" href="css/design-system.css">  
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/toolbar.css">
    <link rel="stylesheet" href="./css/panels.css">
    <link rel="stylesheet" href="./css/clock.css">
    <link rel="stylesheet" href="./css/posture-card.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/dialogs.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/responsive.css">

</head>

<body>

    <!-- CABECERA -->

    <header id="header"></header>

    <!-- BARRA DE HERRAMIENTAS -->

    <nav id="toolbar"></nav>


    
    <!-- CONTENIDO PRINCIPAL -->

    <main id="app">

        <!-- ZONA PRINCIPAL DE PRÁCTICA -->

        <section id="practice-area">

            <!-- POSTURA ACTIVA -->

             <section id="active-posture-panel">

                <div id="active-posture"></div>

            </section>


            <!-- CÍRCULO DE POSTURAS -->

            <section id="clock-panel">

                <div id="clock-container">

                    <!-- CENTRO DEL CÍRCULO -->

                    <div id="sun-center">
                        
                        <img
                            src="./assets/icons/sol.png"
                            alt="Sol"
                            class="sun-center-image"
                            width="75"
                        >

                        <div class="sun-center-title">
                           <h2>Saludo al Sol</h2>
                        </div>

                        <div class="sun-center-subtitle">
                            <p>Surya Namaskar</p>
                        </div>

                        <div class="sun-center-count">
                            <span>11 posturas</span>
                        </div>

                    </div>


                    <!-- SVG DEL CÍRCULO -->

                    <svg
                        id="clock-svg"
                        viewBox="0 0 1000 1000"
                        aria-label="Ciclo de 11 posturas del Saludo al Sol">
                    </svg>


                    <!-- IMÁGENES DE LAS POSTURAS -->

                    <div id="postures"></div>

                </div>

            </section>

        </section>

    </main>


    <!-- DIÁLOGOS -->

    <div id="dialogs"></div>

    <!-- PIE -->

    <footer id="footer"></footer>

    <!-- APP -->

    <script type="module" src="./js/app.js"></script>

</body>

</html>
